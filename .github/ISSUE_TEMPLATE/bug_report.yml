name: Bug report
description: Report a discovery, playback or interface problem
body:
  - type: input
    id: version
    attributes:
      label: AirBridge version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Devices and network
      description: Windows build, iOS version, iPhone/iPad model, Wi-Fi or Ethernet, GPU if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Steps to reproduce, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Review before uploading. Remove addresses, device names and personal data. Never upload identity keys.
